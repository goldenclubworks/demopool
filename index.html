<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1b86c4" />
  <meta name="description" content="Pool-Planer in 3D: Modell, Farbe, Terrasse und Extras wählen und den Pool per AR im eigenen Garten ansehen." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect x=%273%27 y=%278%27 width=%2726%27 height=%2716%27 rx=%275%27 fill=%27%231b86c4%27/%3E%3Cpath d=%27M6 17c3-3 5 3 8 0s5 3 8 0 3-1 4 0%27 stroke=%27%23fff%27 stroke-width=%272%27 fill=%27none%27/%3E%3C/svg%3E" />
  <title>Pool-Planer 3D</title>
  <style>
    :root {
      --bg: #e9eef1; --panel: rgba(255,255,255,.93); --ink: #14212b; --muted: #5a6b78;
      --line: rgba(20,33,43,.13); --accent: #1b86c4; --accent-ink: #fff; --soft: rgba(27,134,196,.09);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f171c; --panel: rgba(21,30,36,.93); --ink: #e6eef3; --muted: #9db0bd; --line: rgba(230,238,243,.15); --accent: #3fa7e0; --accent-ink: #04141f; --soft: rgba(63,167,224,.14); }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); overflow: hidden; overscroll-behavior: none; touch-action: manipulation; -webkit-text-size-adjust: 100%; }
    button, .btn, .panel { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    canvas#c { background: #7f9bb5; position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    [hidden] { display: none !important; }
    .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 10px 34px rgba(0,0,0,.16); }
    button, .btn { font: inherit; font-size: 13.5px; color: var(--ink); background: transparent; border: 0; padding: 8px 12px; cursor: pointer; min-height: 38px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; border-radius: 0; }
    button:hover { background: rgba(127,127,127,.12); }
    button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
    button.solid, .btn.solid { background: var(--accent); color: var(--accent-ink); border-radius: 12px; font-weight: 600; padding: 9px 16px; }
    button.ghost { border: 1px solid var(--line); border-radius: 12px; }
    button:disabled { opacity: .4; cursor: default; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .seg { display: flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .seg button { flex: 1 1 auto; }
    .seg button + button { border-left: 1px solid var(--line); }

    #cfg { top: max(14px, env(safe-area-inset-top)); left: 14px; bottom: 14px; width: 352px; display: flex; flex-direction: column; overflow: hidden; }
    #head { padding: 14px 16px 8px; display: flex; align-items: center; gap: 12px; }
    #brand-logo { max-height: 34px; max-width: 90px; object-fit: contain; border-radius: 6px; background: #fff; padding: 2px 4px; }
    #brand-eyebrow { display: block; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    #brand-name { font-size: 19px; margin: 1px 0 0; letter-spacing: -.01em; font-weight: 700; }
    #b-panel { display: none; margin-left: auto; border: 1px solid var(--line); border-radius: 12px; }
    #stepper { display: flex; gap: 2px; padding: 4px 12px 10px; border-bottom: 1px solid var(--line); }
    #stepper button { flex: 1; flex-direction: column; gap: 3px; padding: 4px 2px; border-radius: 10px; min-height: 48px; font-size: 11px; color: var(--muted); }
    #stepper i { font-style: normal; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--ink); }
    #stepper button.done i { background: var(--soft); border-color: var(--accent); }
    #stepper button[aria-current="true"] { color: var(--ink); background: var(--soft); }
    #stepper button[aria-current="true"] i { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    #body { overflow-y: auto; padding: 4px 16px 14px; flex: 1; overscroll-behavior: contain; }
    .step h2 { font-size: 17px; margin: 14px 0 4px; letter-spacing: -.01em; }
    .lead { margin: 0 0 10px; font-size: 13px; color: var(--muted); line-height: 1.45; }
    .sec { margin-top: 16px; }
    .lab { display: flex; justify-content: space-between; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
    .lab small { text-transform: none; letter-spacing: 0; }
    .note { font-size: 12px; color: var(--muted); margin: 7px 0 0; line-height: 1.4; }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .mc { flex-direction: column; align-items: flex-start; gap: 2px; padding: 8px 10px 10px; border: 1.5px solid var(--line); border-radius: 14px; text-align: left; min-height: 0; color: var(--ink); }
    .mc svg { width: 100%; height: 54px; margin-bottom: 4px; } .mc svg path { fill: rgba(60,160,215,.28); stroke: var(--accent); stroke-width: 2.2; stroke-linejoin: round; }
    .mc b { font-size: 15px; } .mc span { font-size: 11.5px; color: var(--muted); } .mc em { font-style: normal; font-size: 12.5px; font-weight: 600; margin-top: 3px; }
    .mc[aria-pressed="true"] { background: var(--soft); border-color: var(--accent); color: var(--ink); }
    .mc[aria-pressed="true"] span { color: var(--muted); } .mc[aria-pressed="true"] svg path { fill: rgba(60,160,215,.5); }
    .sw { width: 40px; height: 40px; min-height: 0; padding: 0; border-radius: 50%; background: var(--c); border: 2px solid var(--line); margin: 0 8px 4px 0; }
    .sw[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 3px var(--panel) inset; background: var(--c); } .sw:hover { background: var(--c); }
    input[type=range] { width: 100%; accent-color: var(--accent); margin: 2px 0 8px; } label { font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; } label output { color: var(--ink); font-weight: 600; }
    .facts { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 16px 0 0; font-size: 13px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; }
    .facts dt { color: var(--muted); } .facts dd { margin: 0; font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
    .extras { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .ex { justify-content: flex-start; gap: 12px; padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 14px; text-align: left; width: 100%; min-height: 52px; }
    .ex .tick { width: 22px; height: 22px; border-radius: 7px; border: 1.8px solid var(--line); flex: none; display: grid; place-items: center; }
    .ex .t { flex: 1; display: flex; flex-direction: column; } .ex b { font-size: 14px; font-weight: 600; } .ex i { font-style: normal; font-size: 11.5px; color: var(--muted); } .ex .p { font-size: 12.5px; color: var(--muted); }
    .ex[aria-pressed="true"] { background: var(--soft); color: var(--ink); border-color: var(--accent); } .ex[aria-pressed="true"] i, .ex[aria-pressed="true"] .p { color: var(--muted); }
    .ex[aria-pressed="true"] .tick { background: var(--accent); border-color: var(--accent); } .ex[aria-pressed="true"] .tick::after { content: ""; width: 6px; height: 11px; border: solid var(--accent-ink); border-width: 0 2.2px 2.2px 0; transform: rotate(45deg) translate(-1px,-1px); }
    #snap { width: 100%; border-radius: 14px; margin: 10px 0 8px; background: var(--soft); min-height: 120px; object-fit: cover; aspect-ratio: 16/10; }
    .sum { list-style: none; padding: 0; margin: 0; font-size: 13.5px; line-height: 1.5; } .sum li { padding: 5px 0; border-bottom: 1px solid var(--line); }
    .brk { width: 100%; border-collapse: collapse; font-size: 13px; } .brk td { padding: 5px 0; border-bottom: 1px solid var(--line); } .brk td:last-child { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 10px; }
    .brk .tot td { font-weight: 700; font-size: 14.5px; border-bottom: 0; padding-top: 9px; }
    .row { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
    #pricebar { position: relative; border-top: 1px solid var(--line); padding: 8px 12px 10px; display: flex; align-items: center; gap: 8px; }
    #b-break { flex: 1; min-width: 0; flex-direction: column; align-items: flex-start; justify-content: center; padding: 2px 8px; min-height: 46px; border-radius: 12px; text-align: left; }
    #b-break small { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); } #price { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; white-space: nowrap; }
    #nav { display: flex; gap: 8px; } #nav button { min-height: 46px; padding: 8px 16px; }
    #breakdown { position: absolute; left: 8px; right: 8px; bottom: calc(100% + 6px); max-height: 40vh; max-height: 40dvh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.2); padding: 6px 12px; font-size: 12.5px; z-index: 4; }
    #breakdown div { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); } #breakdown div:last-child { border-bottom: 0; } #breakdown b { font-variant-numeric: tabular-nums; white-space: nowrap; }
    #foot { padding: 0 16px 10px; font-size: 10.5px; color: var(--muted); }
    #actions { top: max(14px, env(safe-area-inset-top)); right: 14px; display: flex; gap: 8px; background: none; border: 0; box-shadow: none; }
    #actions button { border-radius: 14px; box-shadow: 0 6px 22px rgba(0,0,0,.18); min-height: 44px; padding: 8px 16px; }
    #actions button.ghost { background: var(--panel); }
    #b-ar .sm { display: none; }
    #viewbar { top: 70px; right: 14px; display: flex; flex-direction: column; overflow: hidden; border-radius: 14px; }
    #viewbar button { min-height: 36px; font-size: 12.5px; justify-content: flex-start; padding: 6px 14px; } #viewbar button + button { border-top: 1px solid var(--line); }
    #toast { top: 70px; left: 50%; transform: translateX(-50%); padding: 10px 14px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 30; }
    #toast.show { opacity: 1; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); font-size: 14px; color: var(--muted); transition: opacity .5s; z-index: 40; }
    #loading.done { opacity: 0; pointer-events: none; }
    .ld { width: min(340px, 84vw); text-align: center; } .ld-title { font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 14px; }
    .ld-track { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; } .ld-track i { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: left; transform: scaleX(0); transition: transform .25s ease-out; border-radius: 99px; }
    #ld-err { margin-top: 16px; } #ld-err p { font-size: 12.5px; color: #c0392b; line-height: 1.45; margin: 0 0 10px; }
    .ld-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 9px; font-size: 12px; } #ld-pct { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); font-size: 14px; }
    #modal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(6,12,16,.5); z-index: 20; padding: 16px; }
    #modal[hidden] { display: none; }
    #modal-body.card { position: static; padding: 20px; max-width: 420px; width: 100%; text-align: center; max-height: 90vh; max-height: 90dvh; overflow-y: auto; }
    #modal-body h2 { font-size: 17px; margin: 0 0 12px; } #modal-body p { font-size: 13.5px; line-height: 1.5; color: var(--muted); margin: 10px 0; } #modal-body p.small { font-size: 12px; }
    #modal-body .sum { text-align: left; }
    .qr { width: 200px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 6px; } .qr svg { display: block; width: 100%; height: auto; }
    .status { display: flex; align-items: center; gap: 10px; justify-content: center; font-size: 13px; margin: 12px 0; min-height: 22px; }
    .spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: sp .8s linear infinite; flex: none; }
    @keyframes sp { to { transform: rotate(360deg); } }


    .btn.ghost { border: 1px solid var(--line); border-radius: 12px; }
    #photo-ui { left: 50%; transform: translateX(-50%); bottom: max(14px, env(safe-area-inset-bottom)); width: min(720px, calc(100vw - 20px)); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
    .ph-title { display: flex; flex-direction: column; gap: 2px; } .ph-title span { font-size: 12px; color: var(--muted); }
    .ph-sl { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px 12px; } .ph-sl label { display: flex; flex-direction: column; gap: 0; font-size: 11.5px; }
    .ph-btn { display: flex; gap: 8px; justify-content: flex-end; } @media (max-width: 560px) { .ph-sl { grid-template-columns: 1fr 1fr; } }
    .photo-mode #cfg, .photo-mode #viewbar, .photo-mode #actions, .photo-mode #toast.hide { display: none; }
    /* Anfrage-Formular, Pakete, Demo-Posteingang, Einbettung */
    #modal-body.card { max-width: 460px; }
    #modal-body form { text-align: left; } .fld { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; font-size: 12.5px; color: var(--muted); }
    .fld small { font-weight: 400; opacity: .8; } .fld input, .fld select, .fld textarea { font: inherit; font-size: 14px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; min-height: 40px; width: 100%; }
    .fld textarea { resize: vertical; } .fld input:focus, .fld select:focus, .fld textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } @media (max-width: 420px) { .two { grid-template-columns: 1fr; } }
    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
    .chk { display: flex; gap: 9px; align-items: flex-start; font-size: 12px; color: var(--muted); line-height: 1.45; margin: 4px 0 8px; } .chk input { margin-top: 2px; width: 18px; height: 18px; flex: none; accent-color: var(--accent); } .chk a { color: var(--accent); }
    .err { color: #c0392b; font-size: 12.5px; margin: 4px 0; text-align: left; }
    .pk { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; } .pk button { flex-direction: column; align-items: flex-start; gap: 2px; border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 10px; min-height: 0; text-align: left; }
    .pk button b { font-size: 13.5px; } .pk button span { font-size: 11px; color: var(--muted); line-height: 1.3; } .pk button:hover { border-color: var(--accent); } .pk button[aria-pressed="true"] span { color: var(--accent-ink); }
    .inbox { text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--bg); margin: 8px 0; font-size: 12.5px; }
    .ib-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; } .ib-score { color: #fff; font-size: 11px; padding: 2px 9px; border-radius: 99px; font-weight: 600; } .ib-meta { margin: 4px 0 8px !important; font-size: 11.5px !important; }
    .ib-body { display: flex; gap: 10px; align-items: flex-start; } .ib-body img { width: 38%; border-radius: 8px; flex: none; } .ib-body ul { margin: 0; padding-left: 16px; line-height: 1.45; color: var(--ink); }
    .hints { margin-top: 10px; font-size: 12.5px; color: var(--muted); } .hints summary { cursor: pointer; font-weight: 600; color: var(--ink); } .hints ul { padding-left: 18px; line-height: 1.45; }
    #foot a { color: var(--muted); }
    .embed #head { padding-top: 10px; } .embed #brand-eyebrow { display: none; }
    @media (max-width: 1100px) and (orientation: landscape) { #cfg { width: 320px; } }
    @media (max-width: 760px), (orientation: portrait) and (max-width: 1100px) {
      #cfg { top: auto; left: 8px; right: 8px; margin: 0 auto; max-width: 620px; bottom: max(8px, env(safe-area-inset-bottom)); width: auto; max-height: 46vh; max-height: 46dvh; }
      #cfg.collapsed #body, #cfg.collapsed #stepper, #cfg.collapsed #foot { display: none; }
      #b-panel { display: inline-flex; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
      #head { padding: 8px 8px 2px 14px; } #brand-eyebrow, #foot { display: none; } #brand-name { font-size: 15px; }
      #stepper { padding: 0 6px 4px; border-bottom: 0; } #stepper button { min-height: 48px; }
      #body { padding: 0 12px 6px; }
      .step h2, .lead, .facts { display: none; }
      .sec { margin-top: 10px; } .step > .sec:first-child { margin-top: 4px; } .lab { margin-bottom: 5px; }
      .cards { display: flex; overflow-x: auto; gap: 8px; margin: 0 -12px; padding: 2px 12px 6px; scroll-snap-type: x proximity; scrollbar-width: none; } .cards::-webkit-scrollbar { display: none; }
      .mc { flex: 0 0 128px; scroll-snap-align: start; } .mc svg { height: 38px; margin-bottom: 2px; }
      .extras { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 4px; }
      .ex { padding: 6px 8px; min-height: 48px; gap: 8px; } .ex i, .ex .p { display: none; } .ex b { font-size: 13px; }
      #pricebar { padding: 6px 10px 8px; } #price { font-size: 18px; } #breakdown { left: 4px; right: 4px; }
      #actions { top: max(8px, env(safe-area-inset-top)); right: 8px; } #actions #b-ask { display: none; } #actions button { min-height: 42px; padding: 6px 14px; }
      #b-ar .lg { display: none; } #b-ar .sm { display: inline; }
      #viewbar { top: max(8px, env(safe-area-inset-top)); left: 8px; right: 148px; flex-direction: row; overflow-x: auto; scrollbar-width: none; border-radius: 14px; } #viewbar::-webkit-scrollbar { display: none; }
      #viewbar button { min-height: 42px; flex: 1 0 auto; justify-content: center; padding: 6px 12px; } #viewbar button + button { border-top: 0; border-left: 1px solid var(--line); }
      #toast { top: 62px; }
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <section id="cfg" class="panel" aria-label="Konfiguration">
    <div id="head">
      <img id="brand-logo" alt="" hidden />
      <div><span id="brand-eyebrow">3D-Konfigurator</span><h1 id="brand-name">Pool-Planer</h1></div>
      <button id="b-panel" aria-expanded="true">Einklappen ▾</button>
    </div>
    <nav id="stepper" aria-label="Schritte"></nav>
    <div id="body"></div>
    <div id="pricebar">
      <button class="pr" id="b-break" aria-expanded="false" aria-controls="breakdown"><small>Beispielpreis ▾</small><span id="price"></span></button>
      <div id="nav"><button class="ghost" id="b-prev">Zurück</button><button class="solid" id="b-next">Weiter</button></div>
      <div id="breakdown" hidden></div>
    </div>
    <div id="foot">Unverbindliche Visualisierung – Maße, Preise und Ausführung laut Angebot.</div>
  </section>

  <section id="actions" class="panel"><button class="ghost" id="b-ask">Anfrage senden</button><button class="solid" id="b-ar"><span class="lg">Im Garten ansehen (AR)</span><span class="sm">Im Garten (AR)</span></button></section>
  <nav id="viewbar" class="panel" aria-label="Ansicht"><button data-v="orbit">Außen</button><button data-v="top">Von oben</button><button data-v="near">Nah</button><button data-v="spin" aria-pressed="false">Rundflug</button><button data-v="dims" aria-pressed="false">Maße</button><button data-v="before" aria-pressed="false">Vorher</button><button data-v="photo" title="Eigenes Gartenfoto hochladen – bleibt auf Ihrem Gerät">Mein Foto</button></nav>
  <input type="file" id="ph-pick" accept="image/*" hidden />
  <section id="photo-ui" class="panel" hidden aria-label="Gartenfoto">
    <div class="ph-title"><b>Ihr Garten</b><span>Ziehen Sie das Becken an die richtige Stelle. Das Foto bleibt auf Ihrem Gerät.</span></div>
    <div class="ph-sl"><label>Drehen<input id="ph-rot" type="range" min="0" max="360" step="1" value="0"></label><label>Sonne<input id="ph-sun" type="range" min="0" max="360" step="1" value="0"></label><label>Horizont<input id="ph-pitch" type="range" min="-40" max="8" step="1" value="-14"></label><label>Höhe<input id="ph-h" type="range" min="0.6" max="3.5" step="0.1" value="1.6"></label></div>
    <div class="ph-btn"><button class="ghost" id="ph-close">Zurück</button><button class="solid" id="ph-save">Bild speichern</button></div>
  </section>

  <div id="toast" class="panel" role="status"></div>
  <div id="modal" hidden><div id="modal-body" class="panel card"></div></div>
  <div id="loading" role="status" aria-live="polite"><div class="ld"><div class="ld-title">Ihr 3D-Konfigurator wird vorbereitet</div><div class="ld-track"><i id="ld-bar"></i></div><div class="ld-row"><span id="ld-pct">0 %</span><small id="ld-status">Texturen, Himmel und Modelle werden geladen</small></div>
    <div id="ld-err" hidden><p></p><div class="row"><button class="solid" id="ld-reload">Neu laden</button><a class="btn ghost" id="ld-safe" href="#">Sicherheitsmodus</a></div></div><noscript>Bitte JavaScript aktivieren.</noscript></div></div>
  <script>
    /* Wächter für den Start. Zeigt NUR echte Startfehler (Hauptskript/Datei nicht ladbar, Absturz vor dem ersten Bild) und nennt Datei und Ursache.
       Harmlose Fremdfehler (Browser-Erweiterungen, Brave/Safari-Schutzfunktionen: „Script error.“ ohne Datei) werden ignoriert. */
    (function () {
      var $ = function (i) { return document.getElementById(i); }, failedFiles = [], shown = false;
      function show(msg, detail) {
        if (shown || window.__started) return; var e = $('ld-err'); if (!e) return; shown = true; e.hidden = false;
        e.querySelector('p').textContent = msg + (detail ? ' [' + detail + ']' : '');
        $('ld-reload').onclick = function () { var u = new URL(location.href); u.searchParams.set('r', Date.now()); location.replace(u.toString()); };        // mit neuem Parameter: umgeht einen veralteten Zwischenspeicher
        $('ld-safe').href = location.pathname + (location.search ? location.search + '&' : '?') + 'safe=1' + location.hash;
      }
      // Dateien, die nicht geladen werden konnten (Skripte, Stylesheets): Capture-Phase, weil Ressourcenfehler nicht bis window sprudeln
      window.addEventListener('error', function (ev) {
        var t = ev.target;
        if (t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) { failedFiles.push((t.src || t.href || '').split('/').pop()); show('Eine Programmdatei konnte nicht geladen werden (Netz oder Browser-Blocker?).', failedFiles.join(', ')); return; }
        var m = ev.message || '', f = ev.filename || '';
        if (!m || /^Script error\.?$/i.test(m) || /ResizeObserver/i.test(m) || (f && f.indexOf(location.origin) !== 0)) return;      // Fremdfehler ignorieren
        window.__lastError = m + ' @' + f.split('/').pop() + ':' + ev.lineno; if (!window.__booted) show('Fehler beim Start.', window.__lastError);
      }, true);
      window.addEventListener('unhandledrejection', function (ev) {
        var r = ev.reason, m = (r && r.message) || String(r || ''); if (/Importing a module script failed|Failed to fetch dynamically imported module|error loading dynamically imported module/i.test(m)) show('Eine Programmdatei konnte nicht geladen werden (Netz oder Browser-Blocker?).', m);
      });
      setTimeout(function () { if (!window.__booted) show('Das Programm wurde nicht gestartet (Hauptskript nicht geladen?).', window.__lastError || failedFiles.join(', ')); }, 15000);
      setTimeout(function () { if (!window.__started) show('Der Start dauert ungewöhnlich lange. Neu laden oder den Sicherheitsmodus (weniger Grafik) versuchen.', window.__lastError || ''); }, 30000);
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
